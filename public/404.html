<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Dra. Thayla Basilio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem;
        background: #f3efe9; color: #1c1a18; font: 300 1rem/1.6 Jost, system-ui, sans-serif; text-align: center;
      }
      .eyebrow { font-size: .6875rem; font-weight: 400; letter-spacing: .32em; text-transform: uppercase; color: #6f665e; }
      h1 { font: 300 clamp(3rem, 10vw, 6rem)/1 'Cormorant Garamond', serif; margin: 1.5rem 0; letter-spacing: -.02em; }
      em { color: #9a7850; }
      p { max-width: 26rem; margin: 0 auto 2.5rem; color: #5f5851; }
      a { display: inline-block; background: #1c1a18; color: #f3efe9; padding: 1rem 1.75rem; text-decoration: none; }
      a:hover { background: #5f5851; }
      a:focus-visible { outline: 1px solid #c2a27a; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Erro 404</p>
      <h1>Página <em>não</em> encontrada.</h1>
      <p>O endereço que você acessou não existe ou mudou de lugar.</p>
      <a class="eyebrow" style="color: #f3efe9" href="/">Voltar ao início</a>
    </main>
  </body>
</html>
